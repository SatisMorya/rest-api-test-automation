[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: fast checks of the most important behaviour
    regression: full regression suite
    get: tests for GET requests
    post: tests for POST requests (need GOREST_TOKEN)
    put: tests for PUT requests (need GOREST_TOKEN)
    delete: tests for DELETE requests (need GOREST_TOKEN)
